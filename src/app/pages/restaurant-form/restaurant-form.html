<div class="form-container">

  <div class="form-card">

    <h1>
      {{ isEditMode ? 'Edit Restaurant' : 'Add Restaurant' }}
    </h1>

    @if (errorMessage) {
      <p class="error-message">
        {{ errorMessage }}
      </p>
    }

    @if (successMessage) {
      <p class="success-message">
        {{ successMessage }}
      </p>
    }

    <div class="form-group">

      <label>Restaurant Name</label>

      <input
        type="text"
        [(ngModel)]="restaurant.name"
        placeholder="Enter restaurant name">
    </div>

    <div class="form-group">

      <label>Address</label>

      <input
        type="text"
        [(ngModel)]="restaurant.address"
        placeholder="Enter address">
    </div>

    <div class="form-group">

      <label>Best Dish</label>

      <input
        type="text"
        [(ngModel)]="restaurant.bestDish"
        placeholder="Enter best dish">
    </div>

    <div class="form-group">

      <label>Rating</label>

      <input
        type="number"
        [(ngModel)]="restaurant.rating"
        min="0"
        max="5"
        step="0.1"
        placeholder="Enter rating">
    </div>

    <div class="actions">

      <a
        routerLink="/restaurants"
        class="cancel-button">
        Cancel
      </a>

      <button
        type="button"
        (click)="saveRestaurant()"
        class="save-button">
        {{ isEditMode ? 'Update' : 'Save' }}
      </button>

    </div>

  </div>

</div>
